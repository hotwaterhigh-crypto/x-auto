name: Auto Generate Posts

on:
  schedule:
    # 毎日JST 6:00 (UTC 21:00前日) に実行してキューを補充
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install tweepy requests

      - name: Generate posts if needed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Asia/Tokyo
        run: python auto_generate.py

      - name: Commit new posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_queue.json
          git diff --staged --quiet || git commit -m "Auto-generate: replenish post queue"
          git push
